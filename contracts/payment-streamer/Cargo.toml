[package]
name = "payment-streamer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Only needed to deploy a real validator instance in tests; production code
# calls it through the lightweight trait-based client below.
submission-validator = { path = "../submission-validator" }
