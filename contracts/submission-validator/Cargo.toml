[package]
name = "submission-validator"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Only needed to deploy a real registry instance in tests; production code
# calls the registry through the lightweight trait-based client below, not
# this crate directly, so the two contracts stay independently deployable.
device-registry = { path = "../device-registry" }
