[package]
name = "payment-streamer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Only needed to deploy real validator/registry instances in tests so
# `claim` can be exercised against real submission counts; production code
# calls the validator through the lightweight trait-based client below.
submission-validator = { path = "../submission-validator" }
device-registry = { path = "../device-registry" }
